[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcl"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
tcl = "tcl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["ledger", "tests"]
pythonpath = ["src", "."]
