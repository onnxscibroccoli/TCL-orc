[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcl"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pydantic>=2.6", "pydantic-settings>=2.3", "pyyaml>=6"]

[project.scripts]
tcl = "tcl.cli:app"
tcl-cli = "tcl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcl = ["py.typed", "crypto/*.json"]

[tool.pytest.ini_options]
testpaths = ["ledger", "tests", "test"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["node_modules", "lib", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741", "E731", "E702"]
