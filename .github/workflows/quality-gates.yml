name: Protocol Verification

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-and-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-production.txt -r verification/requirements.txt -r requirements-test.txt
      - run: npm ci
      - run: npm run test:runtime
      - run: npm run test:contracts
      - run: npm run audit:contracts
      - run: npm run lint:docs
      - run: npm run audit:provenance
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-contract-audit
          if-no-files-found: error
          path: build/audit/contracts.json

  real-proof-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate and verify local test ceremony
        run: npm run zk:setup
      - name: Prove, mutate, verify, and redeem on local EVM
        run: npm run test:zk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-test-verifier-manifest
          if-no-files-found: error
          path: |
            build/zk/manifest.json
            build/zk/PufVerifier.sol
            build/zk/verification_key.json

  render-specification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [runtime-and-ledger, real-proof-integration, rootless-execution]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install document renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended
      - name: Render specification and accessible HTML preview
        run: |
          mkdir -p build _site
          pandoc docs/05_protocol.md --standalone --toc --number-sections \
            --pdf-engine=xelatex -V geometry:margin=1in -o build/protocol-specification.pdf
          pandoc docs/05_protocol.md --standalone --toc --mathml \
            --metadata title='TCL Executable Protocol Specification' -o _site/index.html
          pandoc docs/06_production_architecture.md --standalone --toc --number-sections \
            --pdf-engine=xelatex -V geometry:margin=1in -o build/production-architecture.pdf
          test -s build/production-architecture.pdf
          test -s build/protocol-specification.pdf
          test -s _site/index.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: protocol-specification
          if-no-files-found: error
          path: |
            build/protocol-specification.pdf
            build/production-architecture.pdf
            _site/index.html

  rootless-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-production.txt
      - name: Start delegated user session for rootless cgroups
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-user-session uidmap
          runner_uid="$(id -u)"
          runner_user="$(id -un)"
          sudo loginctl enable-linger "$runner_user"
          sudo systemctl start "user@${runner_uid}.service"
          export XDG_RUNTIME_DIR="/run/user/$runner_uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          systemctl --user start dbus.socket
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5
        with:
          rootless: true
      - name: Resolve disposable test image digest
        run: |
          docker pull python:3.12-slim
          image="$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}')"
          test -n "$image"
          echo "TCL_SMOKE_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Verify actual isolation and uncertain-task cleanup
        run: python3 scripts/container_smoke.py --image "$TCL_SMOKE_IMAGE" --output build/audit/rootless-acceptance.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rootless-container-acceptance
          if-no-files-found: error
          path: build/audit/rootless-acceptance.json

      - name: Resolve protocol validation base digest
        run: |
          docker pull node:22-bookworm-slim
          image="$(docker image inspect node:22-bookworm-slim --format '{{index .RepoDigests 0}}')"
          test -n "$image"
          echo "TCL_VALIDATION_BASE=$image" >> "$GITHUB_ENV"
      - name: Run full protocol validation offline in rootless container
        run: python3 scripts/container_validation.py --base-image "$TCL_VALIDATION_BASE" --output build/audit/protocol-validation
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rootless-protocol-validation
          if-no-files-found: error
          path: build/audit/protocol-validation/
