name: Docs-as-Code Quality Gates

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '.github/workflows/quality-gates.yml'
      - '.vale.ini'
      - '.markdownlint-cli2.mjs'
  push:
    branches: [ main ]

jobs:
  markdown-structure-lint:
    name: Markdown Structure & Accessibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linting Dependencies
        run: npm ci || npm install markdownlint-cli2

      - name: Execute Markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: '.markdownlint-cli2.mjs'
          globs: 'docs/**/*.md'

  prose-style-lint:
    name: Prose Style & Terminology
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Vale CLI
        uses: errata-ai/action-vale@v2
        with:
          vale_flags: "--minAlertLevel=warning"
          filter_mode: added
          fail_on_error: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

  math-katex-verification:
    name: Formal Math & KaTeX Parsing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install KaTeX Parser
        run: npm install katex

      - name: Run KaTeX Syntax Validator
        run: node .github/scripts/validate-katex.js

  compile-pdf-artifact:
    name: Compile Institutional PDF (Pandoc + XeLaTeX)
    runs-on: ubuntu-latest
    needs: [markdown-structure-lint, prose-style-lint, math-katex-verification]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Pandoc & LaTeX Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic pandoc-citeproc

      - name: Build PDF via XeLaTeX
        run: |
          mkdir -p build/
          pandoc docs/00_whitepaper.md \
            --from=markdown+yaml_metadata_block \
            --pdf-engine=xelatex \
            --citeproc \
            --bibliography=docs/references.bib \
            --number-sections \
            --toc \
            -V geometry:margin=1in \
            -o build/cryptoeconomic_whitepaper.pdf || true

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: build/cryptoeconomic_whitepaper.pdf

  deploy-staging-preview:
    name: Deploy GitHub Pages Staging Preview
    runs-on: ubuntu-latest
    needs: [compile-pdf-artifact]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Build Static Site Pages
        run: |
          echo "Building HTML artifact for GitHub Pages preview..."

      - name: Upload Deployment Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'
