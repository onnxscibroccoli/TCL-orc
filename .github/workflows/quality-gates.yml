name: Docs-as-Code Quality Gates

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - '.github/workflows/quality-gates.yml'
      - '.vale.ini'
      - '.markdownlint-cli2.mjs'
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdown-structure-lint:
    name: Markdown Structure & Accessibility (changed docs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Historical doc lint debt is tracked separately; reject new violations.
      - name: Collect changed Markdown files
        id: changed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base SHA unavailable: refusing to skip the check" >&2
            exit 1
          fi
          # A broken git diff must not look like an empty changed-file list.
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- docs/ > changed-paths.txt
          grep -E '^docs/.*\.md$' changed-paths.txt > changed-docs.txt || test "$?" -eq 1
          if [[ -s changed-docs.txt ]]; then
            {
              echo 'globs<<EOD'
              cat changed-docs.txt
              echo 'EOD'
            } >> "$GITHUB_OUTPUT"
            cat changed-docs.txt
          else
            echo 'globs=' >> "$GITHUB_OUTPUT"
            echo "No changed Markdown under docs/"
          fi

      - name: Execute Markdownlint-cli2
        if: steps.changed.outputs.globs != ''
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: '.markdownlint-cli2.mjs'
          globs: ${{ steps.changed.outputs.globs }}

  prose-style-lint:
    name: Prose Style & Terminology (changed lines)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # v3 now reports all of docs/ on pushes even with filter_mode=added.
      # Explicit changed-file selection prevents unrelated legacy alerts from
      # failing a docs-neutral release. Unresolvable diffs fail closed.
      - name: Resolve changed prose files
        id: changed-prose
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}" || exit 1
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- docs/ > changed-prose-paths.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          paths = Path("changed-prose-paths.txt").read_text().splitlines()
          selected = sorted(p for p in paths if p.startswith("docs/") and p.endswith(".md"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("files=" + json.dumps(selected, separators=(",", ":")) + "\n")
          print("Vale files:", selected)
          PY

      - name: Run Vale on changed documentation only
        if: steps.changed-prose.outputs.files != '[]'
        uses: vale-cli/vale-action@v3
        with:
          files: ${{ steps.changed-prose.outputs.files }}
          min_alert_level: error
          reporter: github-pr-annotations
          filter_mode: added
          fail_on_error: true

  math-katex-verification:
    name: Formal Math & KaTeX Parsing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install KaTeX Parser
        run: npm install katex

      - name: Run KaTeX Syntax Validator
        run: node .github/scripts/validate-katex.js

  compile-pdf-artifact:
    name: Compile Institutional PDF (Pandoc + XeLaTeX)
    runs-on: ubuntu-latest
    needs: [markdown-structure-lint, prose-style-lint, math-katex-verification]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Pandoc & LaTeX Engine
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended texlive-plain-generic

      - name: Build PDF via XeLaTeX
        run: |
          mkdir -p build/
          pandoc docs/00_whitepaper.md \
            --from=markdown+yaml_metadata_block \
            --pdf-engine=xelatex \
            --number-sections \
            --toc \
            -V geometry:margin=1in \
            -o build/cryptoeconomic_whitepaper.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: build/cryptoeconomic_whitepaper.pdf
          if-no-files-found: error

  deploy-staging-preview:
    # This produces an HTML preview artifact only; it does not deploy a site.
    name: Build GitHub Pages Preview Artifact (no deployment)
    runs-on: ubuntu-latest
    needs: [compile-pdf-artifact]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Pandoc for HTML Preview
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build Static Site Pages
        run: |
          set -euo pipefail
          mkdir -p _site
          pandoc --standalone --from=gfm --to=html5 docs/00_whitepaper.md -o _site/index.html
          test -s _site/index.html

      - name: Upload Deployment Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'
