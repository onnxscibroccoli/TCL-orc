[profile.default]
src = "contracts"
test = "test/contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "./test/contracts/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[fuzz]
runs = 512

[lint]
ignore = ["contracts/verifiers/*.sol"]
